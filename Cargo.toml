[package]
name = "tokendiet"
version = "0.1.0"
edition = "2021"
authors = ["TokenDiet Contributors"]
description = "Lossless Prompt & AST Token Compressor for LLMs"
license = "MIT"
repository = "https://github.com/tokendiet/tokendiet"

[lib]
name = "tokendiet"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tokendiet"
path = "cli/main.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[dev-dependencies]
serde_json = "1.0"
